name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build (${{ matrix.cc }}, sanitize=${{ matrix.sanitize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCANON_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Plain make build (gcc only)
        if: matrix.cc == 'gcc' && matrix.sanitize == 'OFF'
        run: make test

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Finite review checks
        run: python3 checks/review_checks.py
      - name: Python unit tests (unittest, no pip installs)
        run: python3 -m unittest discover -s tests/python -q
      - name: Comparison script smoke test
        run: python3 refs/compare/compare.py --help

  provenance:
    name: source provenance (offline, failure allowed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Third-party sources are not redistributed, so status MISSING is expected in CI.
      - run: python3 review_sources/fetch_sources.py
